<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>akro-app — Safety MTO Platform · Hi-fi screens</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { height: 100%; }
    body { background: #f0eee9; }
    /* artboards host */
    .pl-artboard { width: 100%; height: 100%; overflow: hidden; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="components/chrome.jsx"></script>
  <script type="text/babel" src="screens/dashboard.jsx"></script>
  <script type="text/babel" src="screens/catalog.jsx"></script>
  <script type="text/babel" src="screens/system-config.jsx"></script>
  <script type="text/babel" src="screens/rule-builder.jsx"></script>
  <script type="text/babel" src="screens/storeman.jsx"></script>
  <script type="text/babel" src="screens/storeman-screens.jsx"></script>
  <script type="text/babel" src="screens/aggregation.jsx"></script>
  <script type="text/babel" src="screens/project-list.jsx"></script>
  <script type="text/babel" src="screens/model-edit.jsx"></script>
  <script type="text/babel" src="screens/cut-plan.jsx"></script>
  <script type="text/babel" src="screens/dashboard-combined.jsx"></script>
  <script type="text/babel" src="screens/labour-settings.jsx"></script>
  <script type="text/babel" src="screens/admin-home.jsx"></script>
  <script type="text/babel" src="screens/mto-approval.jsx"></script>
  <script type="text/babel" src="screens/pm-system-builder.jsx"></script>
  <script type="text/babel" src="screens/pm-project-activity.jsx"></script>
  <script type="text/babel" src="screens/pm-new-project.jsx"></script>
  <script type="text/babel" src="screens/foreman-mobile.jsx"></script>
  <script type="text/babel" src="screens/estimator-home.jsx"></script>
  <script type="text/babel" src="screens/quote-detail.jsx"></script>
  <script type="text/babel" src="screens/project-working-set.jsx"></script>
  <script type="text/babel" src="screens/po-detail.jsx"></script>
  <script type="text/babel" src="screens/stock-overview.jsx"></script>
  <script type="text/babel" src="screens/catalog-hub.jsx"></script>
  <script type="text/babel" src="screens/settings-hub.jsx"></script>
  <script type="text/babel" src="screens/project-schedule.jsx"></script>
  <script type="text/babel" src="screens/project-schedule-kanban.jsx"></script>
  <script type="text/babel" src="screens/cross-schedule.jsx"></script>
  <script type="text/babel" src="screens/schedule-extras.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "density": "compact",
      "mtoState": "approved",
      "groupBy": "category",
      "sidebarCollapsed": false
    }/*EDITMODE-END*/;

    const W = 1440, H = 900;
    const WB_W = 1600, WB_H = 1040;
    const MOBILE_W = 390, MOBILE_H = 844;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const sidebarProps = {
        collapsed: t.sidebarCollapsed,
        onToggleCollapse: () => setTweak('sidebarCollapsed', !t.sidebarCollapsed),
      };
      return (
        <>
          <DesignCanvas>
            <DCSection
              id="overview"
              title="akro-app · Safety MTO Platform"
              subtitle="Cool slate base, controlled industrial blue, single hi-vis amber reserved for warnings · Geist Sans + Geist Mono · click any artboard to focus, ←/→ to step.">
              <DCArtboard id="dashboard" label="01 · Project Dashboard" width={W} height={H}>
                <div className="pl-artboard"><Dashboard density={t.density} state={t.mtoState} groupBy={t.groupBy} {...sidebarProps} /></div>
              </DCArtboard>
              <DCArtboard id="catalog" label="02 · Material Catalog + New Material modal" width={W} height={H}>
                <div className="pl-artboard"><Catalog density={t.density} {...sidebarProps} /></div>
              </DCArtboard>
              <DCArtboard id="system" label="03 · System Instance configuration" width={W} height={H}>
                <div className="pl-artboard"><SystemConfig density={t.density} {...sidebarProps} /></div>
              </DCArtboard>
              <DCArtboard id="rule" label="04 · Rule Builder + live preview" width={W} height={H}>
                <div className="pl-artboard"><RuleBuilder density={t.density} {...sidebarProps} /></div>
              </DCArtboard>
            </DCSection>

            <DCSection
              id="rollup"
              title="Field & roll-up"
              subtitle="Mobile storeman workflow and the multi-project combined MTO. Project list closes the loop with bulk-select for aggregation.">
              <DCArtboard id="storeman-home" label="05a · Storeman · Picking Lists (home)" width={MOBILE_W} height={MOBILE_H}>
                <div className="pl-artboard"><StoremanHome /></div>
              </DCArtboard>
              <DCArtboard id="storeman-detail" label="05b · Storeman · Picking list detail + Issue sheet" width={MOBILE_W} height={MOBILE_H}>
                <div className="pl-artboard"><StoremanListDetail /></div>
              </DCArtboard>
              <DCArtboard id="storeman-scan" label="05c · Storeman · Scan tab (smart routing)" width={MOBILE_W} height={MOBILE_H}>
                <div className="pl-artboard"><StoremanScan /></div>
              </DCArtboard>
              <DCArtboard id="storeman-stock" label="05d · Storeman · Stock detail + movements" width={MOBILE_W} height={MOBILE_H}>
                <div className="pl-artboard"><StoremanStock /></div>
              </DCArtboard>
              <DCArtboard id="storeman-more" label="05e · Storeman · More (profile + activity)" width={MOBILE_W} height={MOBILE_H}>
                <div className="pl-artboard"><StoremanMore /></div>
              </DCArtboard>
              <DCArtboard id="storeman" label="05f · Storeman · Post-scan issue (legacy)" width={MOBILE_W} height={MOBILE_H}>
                <div className="pl-artboard"><Storeman /></div>
              </DCArtboard>
              <DCArtboard id="aggregate" label="06 · Multi-project aggregation" width={W} height={H}>
                <div className="pl-artboard"><Aggregation density={t.density} {...sidebarProps} /></div>
              </DCArtboard>
              <DCArtboard id="projects" label="07 · Project list + bulk-select" width={W} height={H}>
                <div className="pl-artboard"><ProjectList density={t.density} {...sidebarProps} /></div>
              </DCArtboard>
            </DCSection>

            <DCSection
              id="authoring"
              title="Authoring workbench"
              subtitle="Where admins do the real work. Model edit page composes header, custom dimensions, variants, and a parts list with rules expressed inline — sub-assemblies and cutting algorithms are first-class.">
              <DCArtboard id="model-edit" label="08 · Model edit workbench · inline rules + sub-assembly bindings" width={WB_W} height={WB_H}>
                <div className="pl-artboard"><ModelEdit density={t.density} {...sidebarProps} /></div>
              </DCArtboard>
              <DCArtboard id="cut-plan" label="09 · Cut plan · linear + plate, picking list" width={W} height={H}>
                <div className="pl-artboard"><CutPlan density={t.density} {...sidebarProps} /></div>
              </DCArtboard>
            </DCSection>

            <DCSection
              id="labour"
              title="Labour & costing"
              subtitle="Manhours flow through the same rule engine — phased, costed, with overrides. Project view shows materials + labour in one summary; tenant settings hold the phase catalog.">
              <DCArtboard id="dashboard-combined" label="10 · Project MTO · materials + labour combined" width={W} height={980}>
                <div className="pl-artboard"><DashboardCombined density={t.density} {...sidebarProps} /></div>
              </DCArtboard>
              <DCArtboard id="labour-settings" label="11 · Settings → Labour · phases + rates" width={W} height={H}>
                <div className="pl-artboard"><LabourSettings density={t.density} {...sidebarProps} /></div>
              </DCArtboard>
            </DCSection>

            <DCSection
              id="admin"
              title="Tenant Admin"
              subtitle="The admin's inbox is the dashboard itself — attention cards, no notification bell. Approving an MTO issues it to storeman in one step.">
              <DCArtboard id="admin-home" label="12 · Admin Dashboard · attention grid" width={W} height={980}>
                <div className="pl-artboard"><AdminHome density={t.density} {...sidebarProps} /></div>
              </DCArtboard>
              <DCArtboard id="mto-approval" label="13 · MTO Approval view · summary + sticky approve bar" width={W} height={980}>
                <div className="pl-artboard"><MtoApproval density={t.density} {...sidebarProps} /></div>
              </DCArtboard>
            </DCSection>

            <DCSection
              id="pm"
              title="Project Manager & Site Foreman"
              subtitle="PM authors System Instances and tracks activity; site foreman confirms handover tickets from a mobile-first app.">
              <DCArtboard id="pm-new" label="14 · New Project wizard · step 2" width={W} height={H}>
                <div className="pl-artboard"><NewProjectWizard density={t.density} {...sidebarProps} /></div>
              </DCArtboard>
              <DCArtboard id="pm-builder" label="15 · System Instance builder · two-panel" width={W} height={H}>
                <div className="pl-artboard"><SystemBuilder density={t.density} {...sidebarProps} /></div>
              </DCArtboard>
              <DCArtboard id="pm-activity" label="16 · Project page · Activity feed" width={W} height={H}>
                <div className="pl-artboard"><ProjectActivity density={t.density} {...sidebarProps} /></div>
              </DCArtboard>
              <DCArtboard id="foreman-home" label="17 · Site Foreman · Pending Receipts (mobile)" width={MOBILE_W} height={MOBILE_H}>
                <div className="pl-artboard"><ForemanHome /></div>
              </DCArtboard>
              <DCArtboard id="foreman-confirm" label="18 · Site Foreman · Confirm handover ticket" width={MOBILE_W} height={MOBILE_H}>
                <div className="pl-artboard"><ForemanConfirm /></div>
              </DCArtboard>
            </DCSection>

            <DCSection
              id="commerce"
              title="Quotes, Procurement & Hubs"
              subtitle="Estimator owns quotes and POs; awarded quotes snapshot into a Project's Working Set. Composition pages: Catalog, Stock, Settings.">
              <DCArtboard id="estimator-home" label="19 · Estimator · Quotes dashboard" width={W} height={980}>
                <div className="pl-artboard"><EstimatorHome density={t.density} {...sidebarProps} /></div>
              </DCArtboard>
              <DCArtboard id="quote-detail" label="20 · Quote detail · Price tab" width={W} height={H}>
                <div className="pl-artboard"><QuoteDetail density={t.density} {...sidebarProps} /></div>
              </DCArtboard>
              <DCArtboard id="project-ws" label="21 · Project · Working Set + Quotes" width={W} height={H}>
                <div className="pl-artboard"><ProjectWorkingSet density={t.density} {...sidebarProps} /></div>
              </DCArtboard>
              <DCArtboard id="po-detail" label="22 · PO detail · lifecycle + lines" width={W} height={H}>
                <div className="pl-artboard"><PoDetail density={t.density} {...sidebarProps} /></div>
              </DCArtboard>
              <DCArtboard id="stock-overview" label="23 · Stock Overview" width={W} height={H}>
                <div className="pl-artboard"><StockOverview density={t.density} {...sidebarProps} /></div>
              </DCArtboard>
              <DCArtboard id="catalog-hub" label="24 · Catalog hub" width={W} height={H}>
                <div className="pl-artboard"><CatalogHub density={t.density} {...sidebarProps} /></div>
              </DCArtboard>
              <DCArtboard id="settings-hub" label="25 · Settings hub" width={W} height={H}>
                <div className="pl-artboard"><SettingsHub density={t.density} {...sidebarProps} /></div>
              </DCArtboard>
            </DCSection>

            <DCSection
              id="schedule"
              title="Schedule & Photos"
              subtitle="Once an MTO is approved, the project moves to a timeline. Tasks auto-generate from System Schedule Templates; foremen drive real-time progress with photos.">
              <DCArtboard id="project-schedule" label="26 · Project · Schedule tab (Gantt + photo side panel)" width={1680} height={1040}>
                <div className="pl-artboard"><ProjectSchedule density={t.density} {...sidebarProps} /></div>
              </DCArtboard>
              <DCArtboard id="project-kanban" label="26b · Project · Schedule tab (Kanban view)" width={1680} height={H}>
                <div className="pl-artboard"><ProjectScheduleKanban density={t.density} {...sidebarProps} /></div>
              </DCArtboard>
              <DCArtboard id="cross-schedule" label="27 · Cross-project Schedule" width={1680} height={H}>
                <div className="pl-artboard"><CrossSchedule density={t.density} {...sidebarProps} /></div>
              </DCArtboard>
              <DCArtboard id="project-photos" label="28 · Project · Photos tab (unified archive)" width={W} height={H}>
                <div className="pl-artboard"><ProjectPhotos density={t.density} {...sidebarProps} /></div>
              </DCArtboard>
              <DCArtboard id="foreman-task" label="29 · Foreman · Task detail (mobile)" width={MOBILE_W} height={MOBILE_H}>
                <div className="pl-artboard"><ForemanTask /></div>
              </DCArtboard>
            </DCSection>
          </DesignCanvas>

          <TweaksPanel title="Tweaks">
            <TweakSection label="Layout" />
            <TweakToggle label="Collapse sidebar"
                         value={t.sidebarCollapsed}
                         onChange={(v) => setTweak('sidebarCollapsed', v)} />
            <TweakRadio label="Table density"
                        value={t.density}
                        options={['compact', 'default', 'comfortable']}
                        onChange={(v) => setTweak('density', v)} />
            <TweakSection label="MTO state (Dashboard)" />
            <TweakRadio label="State"
                        value={t.mtoState}
                        options={['draft', 'approved', 'modified']}
                        onChange={(v) => setTweak('mtoState', v)} />
            <TweakSection label="MTO grouping (Dashboard)" />
            <TweakRadio label="Group by"
                        value={t.groupBy}
                        options={['system', 'material', 'category', 'supplier']}
                        onChange={(v) => setTweak('groupBy', v)} />
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
